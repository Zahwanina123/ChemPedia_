name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Kode Sumber
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Generate Gradle Wrapper & Konfigurasi Build
        run: |
          cd android
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          echo "android.skipBuildDependencyValidation=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          if [ -f settings.gradle ]; then
            sed -i 's/8.3.2/8.5.2/g' settings.gradle
          fi
          cd ..

      - name: 📦 Install Dependensi Flutter
        run: flutter pub get

      - name: 🔨 Build APK (Release)
        run: |
          flutter build apk --release \
            --android-skip-build-dependency-validation \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: 🚀 Upload APK sebagai Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-android-apk
          path: build/app/outputs/**/app-release.apk
          retention-days: 14
