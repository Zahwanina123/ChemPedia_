name: Build Android APK (ChemPedia)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: ⚙️ Pasang Gradle 9.3.1 Wrapper Resmi
        run: |
          mkdir -p android/gradle/wrapper
          curl -sLo android/gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar
          EXPECTED="b3a875ddc1f044746e1b1a55f645584505f4a10438c1afea9f15e92a7c42ec13"
          ACTUAL=$(sha256sum android/gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "CHECKSUM ERROR: $ACTUAL"
            exit 1
          fi
          echo "Checksum OK"
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-all.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          curl -sLo android/gradlew \
            https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradlew
          chmod +x android/gradlew

      - name: 📦 Download Flutter Dependencies
        run: flutter pub get

      - name: 🔨 Build Android Release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChemPedia-Release-APK
          path: build/app/outputs/**/app-release.apk
          retention-days: 14
